<style>
/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
.login-overlay{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);
  display:flex;align-items:center;justify-content:center;transition:opacity .3s
}
.login-overlay.hidden{opacity:0;pointer-events:none}
.login-card{
  background:#fff;border-radius:16px;padding:40px 48px;width:360px;
  box-shadow:0 24px 64px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:22px
}
.login-logo{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;color:#1a1a18;letter-spacing:-.5px;text-align:center}
.login-logo span{color:#22c55e}
.login-subtitle{font-size:12px;color:rgba(26,26,24,.45);text-align:center;margin-top:-14px;font-family:'IBM Plex Mono',monospace}
.login-field{display:flex;flex-direction:column;gap:6px}
.login-field label{font-size:10px;font-weight:500;color:rgba(26,26,24,.5);letter-spacing:.1em;text-transform:uppercase}
.login-field input{
  padding:10px 14px;border:1.5px solid rgba(26,26,24,.15);border-radius:10px;
  font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s;
  background:#fafaf8;color:#1a1a18
}
.login-field input:focus{border-color:#22c55e}
.login-btn{
  padding:12px;border:none;border-radius:10px;background:#1a1a18;color:#fff;
  font-size:14px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;transition:background .15s
}
.login-btn:hover{background:#22c55e}
.login-error{font-size:11px;color:#ef4444;text-align:center;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:8px;display:none}
.login-error.visible{display:block}
.login-footer{font-size:10px;color:rgba(26,26,24,.3);text-align:center;font-family:'IBM Plex Mono',monospace}
.logout-btn{background:none;border:1px solid rgba(26,26,24,.15);border-radius:20px;padding:4px 10px;font-size:11px;cursor:pointer;color:rgba(26,26,24,.5);font-family:'Inter',sans-serif;transition:all .15s}
.logout-btn:hover{border-color:rgba(26,26,24,.4);color:#1a1a18}
.sdp-leaflet-popup .leaflet-popup-content-wrapper{
  border-radius:12px;padding:0;box-shadow:0 8px 32px rgba(0,0,0,.15);
  font-family:IBM Plex Mono,monospace;border:1px solid rgba(26,26,24,.08)
}
.sdp-leaflet-popup .leaflet-popup-content{margin:18px 18px 16px}
.sdp-leaflet-popup .leaflet-popup-tip-container{margin-top:-1px}
.sdp-leaflet-popup .leaflet-popup-tip{background:#fff}
.sdp-leaflet-popup .leaflet-popup-close-button{
  top:10px!important;right:12px!important;color:rgba(26,26,24,.35)!important;
  font-size:16px!important;font-weight:400!important;padding:0!important
}
.sdp-leaflet-popup .leaflet-popup-close-button:hover{color:#1a1a18!important}

body{font-family:'Inter',sans-serif;background:#f5f0e8;color:#1a1a18;font-size:13px;display:flex}

/* ── SIDEBAR ── */
.sidebar{
  width:auto;min-width:80px;
  background:#fff;
  border-right:1px solid rgba(26,26,24,.1);
  display:flex;flex-direction:column;align-items:center;
  height:100vh;overflow:hidden;flex-shrink:0;
}
.brand{
  padding:16px 0 12px;width:100%;
  display:flex;flex-direction:column;align-items:center;
  border-bottom:1px solid rgba(26,26,24,.07);
}
.brand-name{
  font-family:'Playfair Display',serif;
  font-size:18px;line-height:1;color:#1a1a18;letter-spacing:-.01em;
}
.brand-name span{color:#c9a84c}.logo-icon{display:none}
.brand-sub{display:none}
.nav-section{padding:10px 0 4px;width:100%}
.nav-label{display:none}
.nav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;padding:10px 0 8px;cursor:pointer;
  transition:background .1s;border-left:2px solid transparent;
  color:rgba(26,26,24,.4);font-size:10px;gap:3px;
}
.nav-item:hover{background:rgba(26,26,24,.04);color:rgba(26,26,24,.75)}
.nav-item.active{border-left-color:#c9a84c;background:rgba(201,168,76,.06);color:#1a1a18}
.nav-item .nav-icon{font-size:16px;flex-shrink:0;margin:0;width:auto;opacity:.75}
.nav-item.active .nav-icon{opacity:1}
.nav-item .nav-label-sm{
  font-family:'Inter',sans-serif;font-size:9px;text-align:center;
  line-height:1.1;color:rgba(26,26,24,.4);letter-spacing:.01em;
}
.nav-item.active .nav-label-sm{color:#1a1a18;font-weight:500}
.nav-count{
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  background:rgba(26,26,24,.07);color:rgba(26,26,24,.5);
  padding:1px 5px;border-radius:8px;min-width:22px;text-align:center;
}
.nav-item.active .nav-count{background:rgba(201,168,76,.18);color:#7a5c1a}
.nav-count.danger{background:rgba(220,38,38,.1);color:#dc2626}
.sidebar-footer{
  margin-top:auto;padding:12px 0;
  border-top:1px solid rgba(26,26,24,.07);
  width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;
}
.sidebar.collapsed{width:52px!important;min-width:52px!important;}.sidebar.collapsed .logo-full{display:none!important;}.sidebar.collapsed .logo-icon{display:flex!important;}
.sidebar.collapsed .nav-label-sm{display:none}
.sidebar.collapsed .brand-name{font-size:13px}
.sidebar-toggle-btn{width:26px;height:26px;border:1px solid rgba(26,26,24,.12);border-radius:6px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(26,26,24,.4);transition:all .15s;padding:0}
.sidebar-toggle-btn:hover{background:rgba(26,26,24,.05);color:#1a1a18;border-color:rgba(26,26,24,.25)}
.status-dot{
  display:inline-block;width:7px;height:7px;
  border-radius:50%;background:#4ade80;animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status-text{display:none}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#fff}

/* ── TOP BAR ── */
.topbar{
  padding:0 24px;height:48px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(26,26,24,.1);
  background:#fff;
  flex-shrink:0;
}
.page-title{
  font-family:'Playfair Display',serif;
  font-size:17px;font-weight:400;
  color:#1a1a18;letter-spacing:-.01em;
}
.topbar-right{display:flex;align-items:center;gap:12px}
.updated-badge{
  display:flex;align-items:center;gap:6px;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;color:#555;
  border:1px solid rgba(26,26,24,.12);
  border-radius:20px;padding:4px 12px;
  background:#fafaf8;
}
.updated-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;flex-shrink:0}
.mw-badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;font-weight:600;
  border:none;
  border-radius:5px;padding:2px 7px;
  background:#f5f5f3;color:rgba(26,26,24,.6);
  letter-spacing:.01em;
}
.mw-badge.alerta{background:#fff7ed;border-color:#f97316;color:#c2410c}
.mw-badge-gen{background:#05233D;color:#fff}
.mw-badge-dem{background:#399439;color:#fff}
.mw-badge-alm{background:#86B3BF;color:#fff}

/* ── CONTENT ── */
.content{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ── SEARCH + FILTERS ── */
.search-area{
  padding:10px 24px 0;
  flex-shrink:0;
}
.search-wrap{
  position:relative;margin-bottom:8px;
}
.search-icon{display:none}
.search-input{
  width:100%;max-width:420px;
  padding:7px 14px 7px 34px;
  border:1px solid rgba(26,26,24,.18);
  border-radius:20px;

.filter-label{pointer-events:none;font-size:11px}
.chevron{display:none}

/* Dropdown multiselección */

}

}

/* ── TABLE ── */
.table-wrap{
  flex:1;overflow-y:auto;
  padding:0 24px 24px;
}
table{width:100%;border-collapse:collapse;min-width:900px}

.sdp-cap-sum-lbl{font-size:9px;color:rgba(26,26,24,.4);text-transform:uppercase;letter-spacing:.08em;font-family:'IBM Plex Mono',monospace}

/* History */

#dash-top-btn-dem.dash-top-btn-active{background:#399439;color:#fff;box-shadow:none}

/* Eye toggle buttons */
.sets-eye-btn{display:flex;align-items:center;gap:4px;padding:4px 9px;border:1px solid rgba(26,26,24,.15);border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;background:#fff;color:rgba(26,26,24,.55);transition:all .15s;white-space:nowrap}

z-index:1199;
}

}

.set-metric{background:#fafaf8;border-radius:8px;padding:10px 12px;border:1px solid rgba(26,26,24,.07)}
.set-metric-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:rgba(26,26,24,.4);margin-bottom:4px}

.sdp-hist-wrap{padding:0}
.sdp-hist-title{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(26,26,24,.4);margin-bottom:10px}
.sdp-hist-svg{width:100%;display:block;overflow:visible}
.sdp-hist-legend{display:flex;gap:12px;margin-top:6px}
.sdp-hist-leg-item{display:flex;align-items:center;gap:4px;font-size:9px;color:rgba(26,26,24,.5);font-family:'IBM Plex Mono',monospace}
.sdp-hist-leg-dot{width:8px;height:8px;border-radius:2px}
.set-projects-table{width:100%;border-collapse:collapse;font-size:11px}
.set-projects-table th{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:rgba(26,26,24,.4);padding:6px 8px;border-bottom:1px solid rgba(26,26,24,.08);text-align:left;white-space:nowrap;background:#fafaf8;position:sticky;top:0}

/* ── Vista Proyectos ───────────────────────────────────────── */

/* Timeline de publicaciones */
.prj-detail-row td{padding:0;background:#f8f7f4 !important}

/* ── Vista Oportunidades ──────────────────────────────────── */
#view-oportunidades{display:none;flex-direction:column;height:100%;overflow:hidden}
